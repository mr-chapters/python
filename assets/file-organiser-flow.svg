<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">File organiser project diagram</title><desc id="d">Files are sorted into folders by their extensions.</desc><rect width="1000" height="400" rx="24" fill="#f4f7ff"/><text x="500" y="55" font-family="Arial,sans-serif" text-anchor="middle" font-size="28" font-weight="700" fill="#1c2d51">FROM MESSY FOLDER TO ORGANIZED FILES</text><g fill="#fff" stroke="#6d88bd" stroke-width="2"><rect x="50" y="115" width="230" height="210" rx="18"/><rect x="385" y="115" width="230" height="210" rx="18"/><rect x="720" y="115" width="230" height="210" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#1c2d51"><text x="165" y="150" font-size="22" font-weight="700">Before</text><text x="500" y="150" font-size="22" font-weight="700">pathlib</text><text x="835" y="150" font-size="22" font-weight="700">After</text><text x="165" y="200" font-size="18">photo.png</text><text x="165" y="232" font-size="18">notes.txt</text><text x="165" y="264" font-size="18">data.csv</text><text x="500" y="205" font-size="18">read extension</text><text x="500" y="237" font-size="18">choose folder</text><text x="500" y="269" font-size="18">move safely</text><text x="835" y="200" font-size="18">png/photo.png</text><text x="835" y="232" font-size="18">txt/notes.txt</text><text x="835" y="264" font-size="18">csv/data.csv</text></g><g stroke="#5274b8" stroke-width="4" fill="none"><path d="M280 220 H375 l-12 -9 m12 9 l-12 9"/><path d="M615 220 H710 l-12 -9 m12 9 l-12 9"/></g><text x="500" y="370" font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#42567d">Always test with copies of files before organising important folders.</text></svg>