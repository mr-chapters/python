<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="t d"><title id="t">Wi-Fi viewer project flow</title><desc id="d">A Python script asks the operating system to list visible Wi-Fi networks and displays the returned information.</desc><rect width="1000" height="400" rx="24" fill="#101a36"/><g stroke="#72d7ff" stroke-width="3" fill="none"><path d="M210 200 H285"/><path d="M455 200 H530"/><path d="M700 200 H775"/></g><g fill="#213761" stroke="#72d7ff" stroke-width="2"><rect x="35" y="125" width="175" height="150" rx="18"/><rect x="285" y="125" width="170" height="150" rx="18"/><rect x="530" y="125" width="170" height="150" rx="18"/><rect x="775" y="125" width="190" height="150" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#f0f7ff"><text x="122" y="165" font-size="21" font-weight="700">Python</text><text x="122" y="195" font-size="16">starts script</text><text x="370" y="165" font-size="21" font-weight="700">platform</text><text x="370" y="195" font-size="16">detects OS</text><text x="615" y="165" font-size="21" font-weight="700">subprocess</text><text x="615" y="195" font-size="16">runs OS tool</text><text x="870" y="165" font-size="21" font-weight="700">Results</text><text x="870" y="195" font-size="16">display text</text><text x="500" y="62" font-size="26" font-weight="700" fill="#9ce8ff">READ-ONLY WI-FI VIEWER</text><text x="500" y="335" font-size="17" fill="#c5d6f7">Shows information reported by your own device; it does not crack passwords or connect to networks.</text></g></svg>