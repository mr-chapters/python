<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d"><title id="t">Import flow</title><desc id="d">Four steps from writing an import to calling a function.</desc><rect width="1000" height="330" rx="24" fill="#101a36"/><g fill="#203761" stroke="#66d6ff" stroke-width="2"><rect x="35" y="95" width="190" height="115" rx="18"/><rect x="280" y="95" width="190" height="115" rx="18"/><rect x="525" y="95" width="190" height="115" rx="18"/><rect x="770" y="95" width="190" height="115" rx="18"/></g><g stroke="#9ce8ff" stroke-width="4" fill="none"><path d="M225 152 H270 l-10 -8 m10 8 l-10 8"/><path d="M470 152 H515 l-10 -8 m10 8 l-10 8"/><path d="M715 152 H760 l-10 -8 m10 8 l-10 8"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#f0f7ff"><text x="130" y="137" font-size="20" font-weight="700">1. Import</text><text x="130" y="169" font-size="16">import math</text><text x="375" y="137" font-size="20" font-weight="700">2. Find</text><text x="375" y="169" font-size="16">Locate module</text><text x="620" y="137" font-size="20" font-weight="700">3. Load</text><text x="620" y="169" font-size="16">Make names ready</text><text x="865" y="137" font-size="20" font-weight="700">4. Use</text><text x="865" y="169" font-size="16">math.sqrt(81)</text></g><text x="500" y="55" font-family="Arial,sans-serif" text-anchor="middle" fill="#9ce8ff" font-size="24" font-weight="700">WHAT HAPPENS WHEN YOU IMPORT?</text><text x="500" y="270" font-family="Arial,sans-serif" text-anchor="middle" fill="#c5d6f7" font-size="17">Python loads the module (or reuses a loaded one), then your code can use its names.</text></svg>