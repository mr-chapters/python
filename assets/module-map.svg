<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="420" viewBox="0 0 1000 420" role="img" aria-labelledby="t d"><title id="t">How modules connect</title><desc id="d">The main program imports reusable modules and uses their functions.</desc><rect width="1000" height="420" rx="24" fill="#f4f7ff"/><g stroke="#5274b8" stroke-width="4" fill="none"><path d="M500 150 V190 H170 V235"/><path d="M500 190 H500 V235"/><path d="M500 190 H830 V235"/></g><g fill="#fff" stroke="#4c72c9" stroke-width="3"><rect x="340" y="45" width="320" height="105" rx="18"/><rect x="55" y="235" width="230" height="110" rx="18"/><rect x="385" y="235" width="230" height="110" rx="18"/><rect x="715" y="235" width="230" height="110" rx="18"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#182747"><text x="500" y="88" font-size="25" font-weight="700">main.py</text><text x="500" y="119" font-size="17">imports what it needs</text><text x="170" y="278" font-size="22" font-weight="700">math_tools.py</text><text x="170" y="309" font-size="17">Reusable functions</text><text x="500" y="278" font-size="22" font-weight="700">game_tools.py</text><text x="500" y="309" font-size="17">Game logic</text><text x="830" y="278" font-size="22" font-weight="700">file_tools.py</text><text x="830" y="309" font-size="17">File helpers</text></g><text x="500" y="390" font-family="Arial,sans-serif" text-anchor="middle" font-size="17" fill="#42567d">One clear responsibility per module makes projects easier to maintain.</text></svg>